<svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#378ADD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D9E75;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" fill="url(#bgGradient)" rx="45"/>

  <!-- Chart bars -->
  <rect x="40" y="110" width="28" height="50" fill="white" opacity="0.9" rx="4"/>
  <rect x="82" y="80" width="28" height="80" fill="white" opacity="0.95" rx="4"/>
  <rect x="124" y="60" width="28" height="100" fill="white" rx="4"/>

  <!-- Base line -->
  <line x1="30" y1="160" x2="160" y2="160" stroke="white" stroke-width="3" opacity="0.5"/>
</svg>